services:
  backend:
    build: !reset null
    image: ${FPV_ROVER_IMAGE_REGISTRY}/${ROVER_GITHUB_OWNER}/${ROVER_GITHUB_REPO}-backend:${BACKEND_IMAGE_TAG:-${IMAGE_TAG}}
    volumes:
      - ${ROVER_OTA_INSTALL_DIR:-.}:/opt/fpv-rover
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ROVER_OTA_SSH_KEY_PATH:-${HOME}/.ssh/fpv_rover_deploy}:/root/.ssh/id_ed25519:ro

  frontend:
    build: !reset null
    image: ${FPV_ROVER_IMAGE_REGISTRY}/${ROVER_GITHUB_OWNER}/${ROVER_GITHUB_REPO}-frontend:${FRONTEND_IMAGE_TAG:-${IMAGE_TAG}}

  mediamtx:
    build: !reset null
    image: ${FPV_ROVER_IMAGE_REGISTRY}/${ROVER_GITHUB_OWNER}/${ROVER_GITHUB_REPO}-mediamtx:${MEDIAMTX_IMAGE_TAG:-${IMAGE_TAG}}
