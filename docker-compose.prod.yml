services:
  backend:
    build: !reset null
    image: ${FPV_ROVER_IMAGE_REGISTRY}/${ROVER_GITHUB_OWNER}/${ROVER_GITHUB_REPO}-backend:${IMAGE_TAG}
    volumes:
      - ${ROVER_OTA_INSTALL_DIR:-.}:/opt/fpv-rover
      - /var/run/docker.sock:/var/run/docker.sock
      - ${ROVER_OTA_SSH_KEY_PATH:-${HOME}/.ssh/fpv_rover_deploy}:/root/.ssh/id_ed25519:ro

  frontend:
    build: !reset null
    image: ${FPV_ROVER_IMAGE_REGISTRY}/${ROVER_GITHUB_OWNER}/${ROVER_GITHUB_REPO}-frontend:${IMAGE_TAG}
