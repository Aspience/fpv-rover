name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_ENV"
          echo "MEDIAMTX_IMAGE=ghcr.io/${owner}/${repo}-mediamtx" >> "$GITHUB_ENV"

      - name: Write version.txt
        run: echo "${{ github.ref_name }}" | sed 's/^v//' > version.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            ROVER_APP_VERSION=${{ github.ref_name }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_RPI_HOST=${{ vars.VITE_RPI_HOST || 'localhost' }}
            VITE_API_PORT=${{ vars.VITE_API_PORT || '8000' }}
            VITE_WEBRTC_PORT=${{ vars.VITE_WEBRTC_PORT || '8889' }}

      - name: Build and push mediamtx image
        uses: docker/build-push-action@v6
        with:
          context: ./infra/mediamtx
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.MEDIAMTX_IMAGE }}:${{ github.ref_name }}
            ${{ env.MEDIAMTX_IMAGE }}:latest

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            version.txt
            docker-compose.yml
            docker-compose.prod.yml
            infra/**/*
            scripts/ota_update.sh
            scripts/bootstrap.sh
            scripts/lib/common.sh
            .env.example
