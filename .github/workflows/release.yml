name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_ENV"
          echo "MEDIAMTX_IMAGE=ghcr.io/${owner}/${repo}-mediamtx" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Detect service changes
        id: changes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${CURRENT}$" | head -1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          # Resolve the tag that a non-rebuilt service would reuse: prefer the
          # value recorded in the previous tag's image-tags.env, else the tag itself.
          resolve_prev_tag() {
            local var_name="$1"
            if [[ -n "$PREV_TAG" ]] && git cat-file -e "${PREV_TAG}:image-tags.env" 2>/dev/null; then
              local value
              value=$(git show "${PREV_TAG}:image-tags.env" | grep "^${var_name}=" | cut -d= -f2- || true)
              if [[ -n "$value" ]]; then
                echo "$value"
                return 0
              fi
            fi
            echo "$PREV_TAG"
          }

          # Decide whether a service must be (re)built and which tag to publish.
          # Prints "<build_flag> <tag>". Forces a rebuild when the image we would
          # otherwise reuse is missing from the registry (e.g. a cancelled release).
          decide() {
            local changed="$1" image="$2" var_name="$3"

            if [[ "$changed" == "true" ]]; then
              echo "true ${CURRENT}"
              return 0
            fi

            local tag
            tag=$(resolve_prev_tag "$var_name")

            if [[ -n "$tag" ]] && docker buildx imagetools inspect "${image}:${tag}" >/dev/null 2>&1; then
              echo "false ${tag}"
            else
              echo "true ${CURRENT}"
            fi
          }

          BACKEND_CHANGED=true
          FRONTEND_CHANGED=true
          MEDIAMTX_CHANGED=true

          if [[ -n "$PREV_TAG" ]]; then
            if git diff --quiet "$PREV_TAG" HEAD -- backend/; then
              BACKEND_CHANGED=false
            fi
            if git diff --quiet "$PREV_TAG" HEAD -- frontend/; then
              FRONTEND_CHANGED=false
            fi
            # mediamtx.yml is mounted as a volume (see docker-compose) and shipped
            # via release files, so changing it alone does not require a rebuild.
            if git diff --quiet "$PREV_TAG" HEAD -- infra/mediamtx/ ':(exclude)infra/mediamtx/mediamtx.yml'; then
              MEDIAMTX_CHANGED=false
            fi
          fi

          read -r BUILD_BACKEND BACKEND_TAG < <(decide "$BACKEND_CHANGED" "$BACKEND_IMAGE" BACKEND_IMAGE_TAG)
          read -r BUILD_FRONTEND FRONTEND_TAG < <(decide "$FRONTEND_CHANGED" "$FRONTEND_IMAGE" FRONTEND_IMAGE_TAG)
          read -r BUILD_MEDIAMTX MEDIAMTX_TAG < <(decide "$MEDIAMTX_CHANGED" "$MEDIAMTX_IMAGE" MEDIAMTX_IMAGE_TAG)

          {
            echo "build_backend=${BUILD_BACKEND}"
            echo "build_frontend=${BUILD_FRONTEND}"
            echo "build_mediamtx=${BUILD_MEDIAMTX}"
            echo "backend_tag=${BACKEND_TAG}"
            echo "frontend_tag=${FRONTEND_TAG}"
            echo "mediamtx_tag=${MEDIAMTX_TAG}"
          } >> "$GITHUB_OUTPUT"

          echo "Previous tag: ${PREV_TAG:-<none>}"
          echo "Build backend: ${BUILD_BACKEND} (tag: ${BACKEND_TAG})"
          echo "Build frontend: ${BUILD_FRONTEND} (tag: ${FRONTEND_TAG})"
          echo "Build mediamtx: ${BUILD_MEDIAMTX} (tag: ${MEDIAMTX_TAG})"

      - name: Build and push backend image
        if: steps.changes.outputs.build_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            ROVER_APP_VERSION=${{ github.ref_name }}

      - name: Build and push frontend image
        if: steps.changes.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_RPI_HOST=${{ vars.VITE_RPI_HOST || 'localhost' }}
            VITE_API_PORT=${{ vars.VITE_API_PORT || '8000' }}
            VITE_WEBRTC_PORT=${{ vars.VITE_WEBRTC_PORT || '8889' }}

      - name: Build and push mediamtx image
        if: steps.changes.outputs.build_mediamtx == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./infra/mediamtx
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.MEDIAMTX_IMAGE }}:${{ github.ref_name }}
            ${{ env.MEDIAMTX_IMAGE }}:latest

      # When a service is not rebuilt, alias the reused image to the current
      # release tag (and latest). This keeps every release tag present in the
      # registry so the next release's reuse lookup (`imagetools inspect
      # <image>:<prev_tag>`) succeeds instead of force-rebuilding. image-tags.env
      # is only a release asset (not committed), so we cannot rely on reading it
      # back from the git tree.
      - name: Retag reused backend image
        if: steps.changes.outputs.build_backend == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${BACKEND_IMAGE}:${{ github.ref_name }}" \
            --tag "${BACKEND_IMAGE}:latest" \
            "${BACKEND_IMAGE}:${{ steps.changes.outputs.backend_tag }}"

      - name: Retag reused frontend image
        if: steps.changes.outputs.build_frontend == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${FRONTEND_IMAGE}:${{ github.ref_name }}" \
            --tag "${FRONTEND_IMAGE}:latest" \
            "${FRONTEND_IMAGE}:${{ steps.changes.outputs.frontend_tag }}"

      - name: Retag reused mediamtx image
        if: steps.changes.outputs.build_mediamtx == 'false'
        run: |
          docker buildx imagetools create \
            --tag "${MEDIAMTX_IMAGE}:${{ github.ref_name }}" \
            --tag "${MEDIAMTX_IMAGE}:latest" \
            "${MEDIAMTX_IMAGE}:${{ steps.changes.outputs.mediamtx_tag }}"

      - name: Write image-tags.env
        run: |
          {
            echo "IMAGE_TAG=${{ github.ref_name }}"
            echo "BACKEND_IMAGE_TAG=${{ steps.changes.outputs.backend_tag }}"
            echo "FRONTEND_IMAGE_TAG=${{ steps.changes.outputs.frontend_tag }}"
            echo "MEDIAMTX_IMAGE_TAG=${{ steps.changes.outputs.mediamtx_tag }}"
          } > image-tags.env

          echo "Wrote image-tags.env:"
          cat image-tags.env

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            image-tags.env
            docker-compose.yml
            docker-compose.prod.yml
            infra/**/*
            scripts/ota_update.sh
            scripts/bootstrap.sh
            scripts/teardown.sh
            scripts/lib/common.sh
            .env.example
