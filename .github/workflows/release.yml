name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set image names
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          repo=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]')
          echo "BACKEND_IMAGE=ghcr.io/${owner}/${repo}-backend" >> "$GITHUB_ENV"
          echo "FRONTEND_IMAGE=ghcr.io/${owner}/${repo}-frontend" >> "$GITHUB_ENV"
          echo "MEDIAMTX_IMAGE=ghcr.io/${owner}/${repo}-mediamtx" >> "$GITHUB_ENV"

      - name: Detect service changes
        id: changes
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG=$(git tag -l 'v*' --sort=-version:refname | grep -v "^${CURRENT}$" | head -1 || true)
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

          BUILD_BACKEND=true
          BUILD_FRONTEND=true
          BUILD_MEDIAMTX=true

          if [[ -n "$PREV_TAG" ]]; then
            if git diff --quiet "$PREV_TAG" HEAD -- backend/; then
              BUILD_BACKEND=false
            fi
            if git diff --quiet "$PREV_TAG" HEAD -- frontend/; then
              BUILD_FRONTEND=false
            fi
            if git diff --quiet "$PREV_TAG" HEAD -- infra/mediamtx/; then
              BUILD_MEDIAMTX=false
            fi
          fi

          echo "build_backend=${BUILD_BACKEND}" >> "$GITHUB_OUTPUT"
          echo "build_frontend=${BUILD_FRONTEND}" >> "$GITHUB_OUTPUT"
          echo "build_mediamtx=${BUILD_MEDIAMTX}" >> "$GITHUB_OUTPUT"

          echo "Previous tag: ${PREV_TAG:-<none>}"
          echo "Build backend: ${BUILD_BACKEND}"
          echo "Build frontend: ${BUILD_FRONTEND}"
          echo "Build mediamtx: ${BUILD_MEDIAMTX}"

      - name: Write version.txt
        run: echo "${{ github.ref_name }}" | sed 's/^v//' > version.txt

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.changes.outputs.build_backend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            ROVER_APP_VERSION=${{ github.ref_name }}

      - name: Build and push frontend image
        if: steps.changes.outputs.build_frontend == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:${{ github.ref_name }}
            ${{ env.FRONTEND_IMAGE }}:latest
          build-args: |
            VITE_RPI_HOST=${{ vars.VITE_RPI_HOST || 'localhost' }}
            VITE_API_PORT=${{ vars.VITE_API_PORT || '8000' }}
            VITE_WEBRTC_PORT=${{ vars.VITE_WEBRTC_PORT || '8889' }}

      - name: Build and push mediamtx image
        if: steps.changes.outputs.build_mediamtx == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./infra/mediamtx
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.MEDIAMTX_IMAGE }}:${{ github.ref_name }}
            ${{ env.MEDIAMTX_IMAGE }}:latest

      - name: Write image-tags.env
        run: |
          CURRENT="${{ github.ref_name }}"
          PREV_TAG="${{ steps.changes.outputs.prev_tag }}"

          resolve_tag() {
            local var_name="$1"
            local build_flag="$2"

            if [[ "$build_flag" == "true" ]]; then
              echo "$CURRENT"
              return 0
            fi

            if [[ -n "$PREV_TAG" ]] && git cat-file -e "${PREV_TAG}:image-tags.env" 2>/dev/null; then
              local value
              value=$(git show "${PREV_TAG}:image-tags.env" | grep "^${var_name}=" | cut -d= -f2- || true)
              if [[ -n "$value" ]]; then
                echo "$value"
                return 0
              fi
            fi

            echo "${PREV_TAG:-$CURRENT}"
          }

          BACKEND_TAG=$(resolve_tag BACKEND_IMAGE_TAG "${{ steps.changes.outputs.build_backend }}")
          FRONTEND_TAG=$(resolve_tag FRONTEND_IMAGE_TAG "${{ steps.changes.outputs.build_frontend }}")
          MEDIAMTX_TAG=$(resolve_tag MEDIAMTX_IMAGE_TAG "${{ steps.changes.outputs.build_mediamtx }}")

          {
            echo "IMAGE_TAG=${CURRENT}"
            echo "BACKEND_IMAGE_TAG=${BACKEND_TAG}"
            echo "FRONTEND_IMAGE_TAG=${FRONTEND_TAG}"
            echo "MEDIAMTX_IMAGE_TAG=${MEDIAMTX_TAG}"
          } > image-tags.env

          echo "Wrote image-tags.env:"
          cat image-tags.env

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            version.txt
            image-tags.env
            docker-compose.yml
            docker-compose.prod.yml
            infra/**/*
            scripts/ota_update.sh
            scripts/bootstrap.sh
            scripts/lib/common.sh
            .env.example
