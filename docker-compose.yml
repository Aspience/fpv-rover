services:
  pigpiod:
    image: ${PIGPIOD_IMAGE:-zinen2/alpine-pigpiod:pigpio-v79}
    restart: unless-stopped
    devices:
      - /dev/gpiochip0:/dev/gpiochip0
    group_add:
      - gpio

  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        ROVER_APP_VERSION: ${ROVER_APP_VERSION:-dev}
    depends_on:
      - pigpiod
    environment:
      BACKEND_IMAGE_TAG: ${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-dev}}
      FRONTEND_IMAGE_TAG: ${FRONTEND_IMAGE_TAG:-${IMAGE_TAG:-dev}}
      MEDIAMTX_IMAGE_TAG: ${MEDIAMTX_IMAGE_TAG:-${IMAGE_TAG:-dev}}
      ROVER_PIGPIO_HOST: pigpiod
      ROVER_PIGPIO_PORT: "8888"
    env_file:
      - .env
      - path: .env.local
        required: false
    ports:
      - "8000:8000"
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/video0:/dev/video0
    # Bluetooth: PF_BLUETOOTH/mgmt sockets are bound to the network namespace and
    # the kernel won't create them outside the host netns. We keep the container
    # on the bridge network (so nginx/frontend can reach backend:8000) and run
    # only bluetoothctl in the host netns via nsenter (see bluetooth.config).
    #   - NET_ADMIN/NET_RAW: open and control the Bluetooth mgmt socket.
    #   - SYS_ADMIN: required by nsenter to re-enter the host network namespace.
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    volumes:
      - /sys/bus/w1:/sys/bus/w1:ro
      - /var/run/dbus:/var/run/dbus
      # Host network namespace, entered by bluetoothctl via nsenter.
      - /proc/1/ns/net:/rootns/net
      # Gamepad evdev hotplug
      - /dev/input:/dev/input
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_RPI_HOST: ${VITE_RPI_HOST}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_WEBRTC_PORT: ${VITE_WEBRTC_PORT}
    env_file:
      - .env
      - path: .env.local
        required: false
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  mediamtx:
    build:
      context: infra/mediamtx
      dockerfile: Dockerfile
    environment:
      - MTX_WEBRTCICEHOSTNAT1TO1IPS=${VITE_RPI_HOST}
    privileged: true
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/video0:/dev/video0
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - /run/udev:/run/udev:ro
    tmpfs:
      - /dev/shm:exec
    restart: unless-stopped
