services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
      args:
        ROVER_APP_VERSION: ${ROVER_APP_VERSION:-dev}
    environment:
      BACKEND_IMAGE_TAG: ${BACKEND_IMAGE_TAG:-${IMAGE_TAG:-dev}}
      FRONTEND_IMAGE_TAG: ${FRONTEND_IMAGE_TAG:-${IMAGE_TAG:-dev}}
      MEDIAMTX_IMAGE_TAG: ${MEDIAMTX_IMAGE_TAG:-${IMAGE_TAG:-dev}}
    env_file:
      - .env
      - path: .env.local
        required: false
    ports:
      - "8000:8000"
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/video0:/dev/video0
    # NET_ADMIN lets bluetoothctl control the host adapter over the shared D-Bus.
    cap_add:
      - NET_ADMIN
    volumes:
      - /sys/bus/w1:/sys/bus/w1:ro
      - /var/run/dbus:/var/run/dbus
    restart: unless-stopped

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
      args:
        VITE_RPI_HOST: ${VITE_RPI_HOST}
        VITE_API_PORT: ${VITE_API_PORT}
        VITE_WEBRTC_PORT: ${VITE_WEBRTC_PORT}
    env_file:
      - .env
      - path: .env.local
        required: false
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./infra/nginx:/etc/nginx/conf.d:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  mediamtx:
    build:
      context: infra/mediamtx
      dockerfile: Dockerfile
    environment:
      - MTX_WEBRTCICEHOSTNAT1TO1IPS=${VITE_RPI_HOST}
    privileged: true
    ports:
      - "8554:8554"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    devices:
      - /dev/i2c-1:/dev/i2c-1
      - /dev/video0:/dev/video0
    volumes:
      - ./infra/mediamtx/mediamtx.yml:/mediamtx.yml:ro
      - /run/udev:/run/udev:ro
    tmpfs:
      - /dev/shm:exec
    restart: unless-stopped
