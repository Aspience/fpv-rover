[project]
name = "fpv-rover-backend"
version = "0.1.0"
description = "FPV Rover backend — async hardware control and telemetry"
requires-python = ">=3.14.5,<3.15"
dependencies = [
    "aiohttp>=3.14.0",
    "fastapi>=0.136.3",
    "httpx>=0.28.0",
    "pydantic>=2",
    "pydantic-settings>=2",
    "uvicorn[standard]>=0.49.0",
    "websockets>=16.0",
]

[project.scripts]
fpv-rover = "main:main"

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pre-commit>=4",
    "pyright>=1.1",
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "modules", "api"]
only-include = ["core", "modules", "api", "main.py", "__init__.py"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "basic"
