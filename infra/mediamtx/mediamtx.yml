paths:
  rover:
    source: rpiCamera
    rpiCameraWidth: 1280
    rpiCameraHeight: 720
    rpiCameraBitrate: 1000000

webrtc: yes
webrtcAddress: :8889
api: yes
apiAddress: :9997

# By default MediaMTX only allows the "api" action from localhost (127.0.0.1/::1),
# so the backend container (a different IP on the Docker network) gets a 401
# "authentication error" when calling the control API. Allow API access from the
# Docker bridge subnet while keeping stream publish/read/playback open.
authInternalUsers:
  - user: any
    pass:
    ips: []
    permissions:
      - action: publish
      - action: read
      - action: playback
  - user: any
    pass:
    ips: ['127.0.0.1', '::1', '172.16.0.0/12']
    permissions:
      - action: api
      - action: metrics
      - action: pprof
