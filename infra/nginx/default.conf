# Docker embedded DNS — re-resolve upstreams when containers are recreated (avoid stale IPs).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;

    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /ws {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /docs {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/docs;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location /openapi.json {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/openapi.json;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }

    location = /index.html {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream/index.html;
        proxy_set_header Host $host;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream/;
        proxy_set_header Host $host;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_tries 2;
    }
}
