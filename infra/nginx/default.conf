# Docker embedded DNS — re-resolve upstreams when containers are recreated (avoid stale IPs).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    location /api/ {
        set $backend_upstream backend:8000;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /ws {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    location /docs {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/docs;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/openapi.json;
        proxy_set_header Host $host;
    }

    location / {
        set $frontend_upstream frontend:80;
        proxy_pass http://$frontend_upstream/;
        proxy_set_header Host $host;
    }
}
